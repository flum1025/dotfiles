# グローバルに使う CLI ツール。
# 言語ランタイムや各アプリ固有のツールは、各リポジトリの .mise.toml で管理する方針。
[tools]
age = "latest"
"aqua:neovim/neovim" = "latest"
aws-vault = "latest"
awscli = { version = "latest", symlink_bins = "true" }
bottom = "latest"
gdu = "latest"
gh = "latest"
grpcurl = "latest"
jq = "latest"
lazygit = "latest"
ripgrep = "latest"
sshuttle = "latest"
tmux = "latest"
"ubi:sorah/mairu" = "latest"
uv = "latest"
yq = "latest"

[settings]
# node のみ .node-version/.nvmrc を読む(.tool-versions は設定に関わらず常に読まれる)
idiomatic_version_file_enable_tools = ["node"]
# aqua/ubi など検証済みバイナリのバックエンドを優先し、プラグイン実行系は無効化
disable_backends = ["asdf", "vfox"]
# dotfiles のソースルート(このリポジトリ)。既定モードは symlink
dotfiles.root = "~/dotfiles"
dotfiles.default_mode = "symlink"

[settings.npm]
package_manager = "bun"

[settings.pipx]
uvx = true

[settings.aqua]
baked_registry = true

# 設定ファイルの配置。source 省略時は dotfiles.root 直下の同名パスを参照。
[dotfiles]
"~/.config/mise/config.toml" = {}                             # 自己管理
"~/.zshrc" = {}
"~/.tmux.conf" = {}
"~/.cargo/config" = {}
"~/.claude/settings.json" = {}
"~/.config/git/config" = {}
"~/.config/zsh" = {}                                          # ディレクトリ丸ごと
"~/.config/tmux" = {}                                         # ディレクトリ丸ごと
"~/.config/alacritty/alacritty.toml" = {}
"~/.config/workmux/config.yaml" = {}
"~/.config/nvim" = {}                                        # dir 丸ごと symlink(ソース: .config/nvim)
# lazygit は macOS のみ(~/Library)。Linux では別途 ~/.config/lazygit を用意する
"~/Library/Application Support/lazygit/config.yml" = {}

[bootstrap.user]
# ログインシェルを zsh に(macOS は標準搭載。Linux では要 apt 導入)
login_shell = "/bin/zsh"

# mise で入らない(registry になし)ツールと GUI/cask。brew(macOS)で導入。
[bootstrap.packages]
"brew:git" = "latest"
"brew:curl" = "latest"
"brew:bash" = "latest"
"brew:pinentry-mac" = "latest"       # GPG 署名のパスフレーズ入力
"brew:tree" = "latest"
"brew:htop" = "latest"
"brew:nmap" = "latest"
"brew:bitwarden-cli" = "latest"
"brew:translate-shell" = "latest"
"brew:pwgen" = "latest"
"brew:watch" = "latest"
"brew-cask:font-hack-nerd-font" = "latest"
"brew-cask:1password-cli" = "latest"
"brew-cask:gcloud-cli" = "latest"
"brew-cask:datadog-agent" = "latest"
"brew-cask:copilot-cli" = "latest"
"brew-cask:mitmproxy" = "latest"
"brew-cask:android-platform-tools" = "latest"
