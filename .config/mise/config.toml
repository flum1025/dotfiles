# グローバルに使う CLI ツール。
# 言語ランタイムや各アプリ固有のツールは、各リポジトリの .mise.toml で管理する方針。
[tools]
age = "latest"
"aqua:neovim/neovim" = "latest"
aws-vault = "latest"
awscli = { version = "latest", symlink_bins = "true" }
bottom = "latest"
fzf = "latest"
gdu = "latest"
gh = "latest"
grpcurl = "latest"
jq = "latest"
"aqua:mike-engel/jwt-cli" = "latest"
lazygit = "latest"
ripgrep = "latest"
sshuttle = "latest"
tmux = "latest"
"ubi:sorah/mairu" = "latest"
uv = "latest"
yq = "latest"

[settings]
# node のみ .node-version/.nvmrc を読む(.tool-versions は設定に関わらず常に読まれる)
idiomatic_version_file_enable_tools = ["node"]
# aqua/ubi など検証済みバイナリのバックエンドを優先し、プラグイン実行系は無効化
disable_backends = ["asdf", "vfox"]
# dotfiles のソースルート(このリポジトリ)。既定モードは symlink
dotfiles.root = "~/dotfiles"
dotfiles.default_mode = "symlink"

[settings.npm]
package_manager = "bun"

[settings.pipx]
uvx = true

[settings.aqua]
baked_registry = true

# 設定ファイルの配置。source 省略時は dotfiles.root 直下の同名パスを参照。
[dotfiles]
"~/.config/mise/config.toml" = {}                             # 自己管理
"~/.zshrc" = {}
"~/.zprofile" = {}
"~/.tmux.conf" = {}
"~/.cargo/config" = {}
"~/.claude/settings.json" = {}
"~/.config/git/config" = {}
"~/.config/git/ignore" = {}                                  # global gitignore
"~/.gnupg/gpg-agent.conf" = {}                               # pinentry-mac + キャッシュ延長(commit 署名の再入力を省略)
"~/.config/zsh" = {}                                          # ディレクトリ丸ごと
"~/.config/tmux" = {}                                         # ディレクトリ丸ごと
"~/.config/alacritty/alacritty.toml" = {}
"~/.config/workmux/config.yaml" = {}
"~/.config/nvim" = {}                                        # dir 丸ごと symlink(ソース: .config/nvim)
"~/.config/karabiner" = {}                                   # dir 丸ごと symlink(Karabiner が json を atomic 書換するため file symlink だと壊れる)
# lazygit は macOS のみ(~/Library)。Linux では別途 ~/.config/lazygit を用意する
"~/Library/Application Support/lazygit/config.yml" = {}

[bootstrap.user]
# ログインシェルを zsh に(macOS は標準搭載。Linux では要 apt 導入)
login_shell = "/bin/zsh"

# brew 系は実 Homebrew に一本化(mise の brew-cask は installer 型 cask=gcloud/datadog を
# 扱えない。formula は /opt/homebrew に入るので結果は同じ)。Brewfile を brew bundle で適用。
# final フック = bootstrap の最後に必ず実行される(packages フェーズの有無に依存しない)。
[bootstrap.hooks.final]
run = """
if [ "$(uname)" = "Darwin" ]; then
  eval "$(/opt/homebrew/bin/brew shellenv)"
  brew bundle --file="$HOME/dotfiles/Brewfile"
fi
"""
